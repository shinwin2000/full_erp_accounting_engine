services:
  # ==================== DATABASE ====================
  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: palapapls88
      POSTGRES_DB: erp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_network

  # ==================== REDIS (Cache & Lock) ====================
  redis:
    image: redis:7-alpine
    container_name: erp_redis
    command: redis-server --appendonly yes --requirepass ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_network

  # ==================== ZOOKEEPER (untuk Kafka mode Zookeeper) ====================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: erp_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_network

  # ==================== KAFKA (dual listener: host + internal) ====================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: erp_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Dua listener: satu untuk akses dari HOST (localhost:9092),
      # satu untuk akses antar-container di erp_network (kafka:29092)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - erp_network

  # ==================== MINIO (Object Storage) ====================
  minio:
    image: minio/minio:latest
    container_name: erp_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # curl tidak tersedia di image minio -> pakai wget
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - erp_network

  # ==================== JAEGER (Tracing backend) ====================
  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: erp_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: true
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"   # Jaeger UI
      - "14250:14250"
      - "14268:14268"
      - "14269:14269"
      # 4317/4318 SENGAJA tidak dipublish ke host di sini,
      # karena OTLP masuk lewat otel-collector (lihat di bawah)
    networks:
      - erp_network

  # ==================== OPENTELEMETRY COLLECTOR ====================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.1
    container_name: erp_otel_collector
    command: ["--config=env:OTEL_CONFIG_YAML"]
    environment:
      OTEL_CONFIG_YAML: |
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
              http:
                endpoint: 0.0.0.0:4318

        processors:
          batch:
            timeout: 5s
            send_batch_size: 512

          memory_limiter:
            check_interval: 2s
            limit_mib: 512
            spike_limit_mib: 128

          resource:
            attributes:
              - key: deployment.environment
                value: development
                action: upsert

        exporters:
          otlp/jaeger:
            endpoint: jaeger:4317
            tls:
              insecure: true

          prometheus:
            endpoint: 0.0.0.0:8889

          debug:
            verbosity: basic

        service:
          pipelines:
            traces:
              receivers: [otlp]
              processors: [memory_limiter, batch, resource]
              exporters: [otlp/jaeger, debug]

            metrics:
              receivers: [otlp]
              processors: [memory_limiter, batch, resource]
              exporters: [prometheus, debug]

            logs:
              receivers: [otlp]
              processors: [memory_limiter, batch, resource]
              exporters: [debug]

          telemetry:
            logs:
              level: info
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
    depends_on:
      - jaeger
    networks:
      - erp_network
  # ==================== MAILHOG (SMTP Mock) ====================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: erp_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - erp_network

  # ==================== HASHICORP VAULT (Secured Credentials) ====================
  vault:
    image: hashicorp/vault:1.15
    container_name: erp_vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      # WAJIB: tanpa ini, vault dev mode hanya listen di 127.0.0.1 DI DALAM
      # container sehingga port mapping ke host tidak akan pernah tersambung
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_LOCAL_CONFIG: '{"ui": true, "default_lease_ttl": "168h", "max_lease_ttl": "720h"}'
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - erp_network

