name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  quality-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest ruff black
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint Code (Ruff & Black Check)
      run: |
        # Memeriksa kerapian format code tanpa mengubah file aslinya
        black --check .
        ruff check .

    - name: Run Unit Tests (Pytest)
      env:
        # Konfigurasi mode simulasi jika modul butuh lingkungan khusus/mock
        APP_ENV: "test"
        SIMULATION_MODE: "true"
      run: |
        # Menjalankan pytest dengan laporan verbose
        pytest -v --maxfail=1 --disable-warnings

  build-and-artifact:
    needs: quality-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Package Application Artifact
      run: |
        echo "Menyiapkan build artifacts..."
        mkdir -p dist
        # Contoh membuat arsip zip dari source code (kecuali folder tersembunyi/venv)
        tar --exclude='.git' --exclude='.github' --exclude='venv' --exclude='__pycache__' -czf dist/app-release.tar.gz .

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: erp-accounting-release
        path: dist/app-release.tar.gz

  # Opsional: Tahap Deployment ke Server / Staging menggunakan Secrets
  deploy:
    needs: build-and-artifact
    runs-on: ubuntu-latest
    # Hanya jalan otomatis jika di branch master/main dan jika Anda sudah set secret
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    
    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: erp-accounting-release
        
    - name: Simulate Deployment Process
      run: |
        echo "Mendeploy aplikasi menggunakan Server IP: ${{ secrets.SERVER_IP }}"
        echo "Deployment Berhasil Dilakukan!"