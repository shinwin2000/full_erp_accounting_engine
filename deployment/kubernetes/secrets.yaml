apiVersion: v1
kind: Secret
metadata:
  name: erp-secrets
  namespace: erp
  labels:
    app: erp-accounting-engine
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://erp_user:strong_password@postgres:5432/erp_db"
  REDIS_URL: "redis://redis:6379/0"
  SECRET_KEY: "your-256-bit-secret-key-here-change-in-production"
  MINIO_ACCESS_KEY: "your-minio-access-key"
  MINIO_SECRET_KEY: "your-minio-secret-key"
  CORETAX_CLIENT_ID: "your-coretax-client-id"
  CORETAX_CLIENT_SECRET: "your-coretax-client-secret"
  ENCRYPTION_MASTER_KEY: "your-256-bit-encryption-key"
  VAULT_TOKEN: "your-vault-token"
  SMTP_PASSWORD: "your-smtp-password"